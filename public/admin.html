<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Noelia Duque</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css"></head>
<body>
<section id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <h1>Panel de gestión</h1><p class="muted">Acceso privado del estudio</p>
    <label>Contraseña<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <div id="login-err" role="alert"></div>
    <button class="btn">Entrar</button>
  </form>
</section>
<div id="app" hidden>
  <aside class="side" id="side">
    <a class="brand" href="#resumen">Noelia Duque<small>Panel de gestión</small></a>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="side-foot"><a href="/" target="_blank" rel="noopener">Ver la web ↗</a><button id="logout">Cerrar sesión</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="drawer-bg" id="drawer-bg"></div><aside class="drawer" id="drawer" aria-hidden="true"></aside>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlg-form"></form></dialog>
<div id="toast" role="status"></div>
<script type="module" src="/js/admin/main.js"></script>
</body></html>
