<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mi Videojuego</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b1a;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;margin:0 auto;height:100%;max-width:100%;background:#05050f}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

let state = 'menu';            // menu | playing | over
let player, bullets, enemies, particles, stars;
let score, best = +(localStorage.getItem('best') || 0), lives, level, t, spawnT, shootT;
const keys = {};
let target = null;             // posición objetivo (ratón / dedo)

stars = Array.from({length: 70}, () => ({x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5}));

function reset() {
  player = {x: W/2, y: H-90, w: 34, h: 40, speed: 6};
  bullets = []; enemies = []; particles = [];
  score = 0; lives = 3; level = 1; t = 0; spawnT = 0; shootT = 0;
}

function boom(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, v = Math.random()*4+1;
    particles.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 30+Math.random()*20, color});
  }
}

function update() {
  stars.forEach(s => { s.y += s.s; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
  if (state !== 'playing') return;
  t++;

  // movimiento
  if (keys.ArrowLeft || keys.a) player.x -= player.speed;
  if (keys.ArrowRight || keys.d) player.x += player.speed;
  if (keys.ArrowUp || keys.w) player.y -= player.speed;
  if (keys.ArrowDown || keys.s) player.y += player.speed;
  if (target) {
    player.x += (target.x - player.x) * 0.25;
    player.y += (target.y - 50 - player.y) * 0.25;
  }
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
  player.y = Math.max(60, Math.min(H - 30, player.y));

  // disparo automático
  if (--shootT <= 0) {
    bullets.push({x: player.x, y: player.y - 22, vy: -10});
    if (level >= 3) { bullets.push({x: player.x-12, y: player.y-14, vy: -10}); bullets.push({x: player.x+12, y: player.y-14, vy: -10}); }
    shootT = 10;
  }
  bullets.forEach(b => b.y += b.vy);
  bullets = bullets.filter(b => b.y > -20);

  // enemigos
  level = 1 + Math.floor(score / 300);
  if (--spawnT <= 0) {
    const big = Math.random() < 0.15;
    enemies.push({x: 30+Math.random()*(W-60), y: -30, r: big ? 24 : 15, hp: big ? 4 : 1,
                  vy: 1.5 + Math.random()*1.2 + level*0.25, ph: Math.random()*6, big});
    spawnT = Math.max(14, 50 - level*5);
  }
  enemies.forEach(e => { e.y += e.vy; e.x += Math.sin(t/25 + e.ph) * 1.5; });

  // colisiones
  for (const e of enemies) {
    for (const b of bullets) {
      if (!b.dead && Math.hypot(e.x-b.x, e.y-b.y) < e.r + 4) {
        b.dead = true; e.hp--;
        if (e.hp <= 0) { e.dead = true; score += e.big ? 50 : 10; boom(e.x, e.y, e.big ? '#ffb347' : '#ff5c8a', e.big ? 28 : 14); }
      }
    }
    if (!e.dead && Math.hypot(e.x-player.x, e.y-player.y) < e.r + 16) {
      e.dead = true; lives--; boom(e.x, e.y, '#fff', 20);
      if (lives <= 0) {
        boom(player.x, player.y, '#4de1ff', 50);
        state = 'over';
        if (score > best) { best = score; try { localStorage.setItem('best', best); } catch(_){} }
      }
    } else if (!e.dead && e.y > H + 40) {
      e.dead = true; score = Math.max(0, score - 5);
    }
  }
  bullets = bullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.fillStyle = '#05050f'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  stars.forEach(s => { ctx.globalAlpha = s.s/3; ctx.fillRect(s.x, s.y, s.s, s.s); });
  ctx.globalAlpha = 1;

  if (state !== 'menu') {
    // balas
    ctx.fillStyle = '#ffe94d';
    bullets.forEach(b => ctx.fillRect(b.x-2, b.y-8, 4, 14));
    // enemigos
    enemies.forEach(e => {
      ctx.fillStyle = e.big ? '#ff9f1c' : '#ff3d71';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#05050f';
      ctx.fillRect(e.x - e.r*0.5, e.y - 3, e.r*0.3, 6); ctx.fillRect(e.x + e.r*0.2, e.y - 3, e.r*0.3, 6);
    });
    // jugador
    if (state === 'playing') {
      ctx.fillStyle = '#4de1ff';
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.h/2);
      ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
      ctx.lineTo(player.x, player.y + player.h/4);
      ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff9f1c';
      ctx.fillRect(player.x-3, player.y + player.h/4 + 2, 6, 6 + (t%6));
    }
    // partículas
    particles.forEach(p => { ctx.globalAlpha = Math.min(1, p.life/30); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); });
    ctx.globalAlpha = 1;
    // HUD
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'left';
    ctx.fillText('Puntos: ' + score, 14, 28);
    ctx.textAlign = 'right'; ctx.fillText('Nivel ' + level, W-14, 28);
    ctx.textAlign = 'center'; ctx.fillText('♥'.repeat(Math.max(0, lives)), W/2, 28);
  }

  if (state === 'menu' || state === 'over') {
    ctx.fillStyle = 'rgba(5,5,15,.7)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#4de1ff';
    ctx.font = 'bold 44px system-ui';
    ctx.fillText(state === 'menu' ? 'MI VIDEOJUEGO' : 'GAME OVER', W/2, 260);
    ctx.fillStyle = '#fff'; ctx.font = '20px system-ui';
    if (state === 'over') ctx.fillText('Puntos: ' + score, W/2, 310);
    ctx.fillText('Récord: ' + best, W/2, 340);
    ctx.fillStyle = '#ffe94d'; ctx.font = 'bold 22px system-ui';
    ctx.fillText('Toca o pulsa ESPACIO para jugar', W/2, 410);
    ctx.fillStyle = '#9aa'; ctx.font = '15px system-ui';
    ctx.fillText('Mueve con el dedo, ratón o flechas · disparo automático', W/2, 450);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function start() { if (state !== 'playing') { reset(); state = 'playing'; } }

function pos(e) {
  const r = cv.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
  return {x: (p.clientX - r.left) * W / r.width, y: (p.clientY - r.top) * H / r.height};
}
cv.addEventListener('pointerdown', e => { if (state !== 'playing') start(); target = pos(e); });
cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') target = pos(e); });
cv.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') target = null; });
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') { start(); e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.key] = false; });

reset(); loop();
</script>
</body>
</html>
