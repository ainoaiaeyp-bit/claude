# /etc/nginx/sites-available/vida  (cambia vida.TUDOMINIO.com por tu dominio)
server {
    listen 80;
    listen [::]:80;
    server_name vida.TUDOMINIO.com;

    root /var/www/vida;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # El service worker y el HTML nunca deben quedarse en caché, o las actualizaciones no llegan
    location = /sw.js            { add_header Cache-Control "no-cache"; }
    location = /index.html       { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }
    location /icons/ { expires 30d; add_header Cache-Control "public"; }

    location / { try_files $uri $uri/ /index.html; }

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
# HTTPS (obligatorio para instalar la PWA en iPhone):
#   sudo certbot --nginx -d vida.TUDOMINIO.com
