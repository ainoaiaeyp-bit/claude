<title>Signa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Aprende lengua de signos española con ilustraciones, tarjetas y tests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Diseño: panel de estudio con "escenario" azul donde se dibuja cada signo (cuerpo, mano y trayectoria). */
:root{--bg:#eef2f8;--surface:#fff;--ink:#101c36;--muted:#56627c;--line:#d9e0ec;--accent:#1556d6;--accent-ink:#fff;--soft:#e3ecff;--hot:#ff6b3d;--ok:#15803d;--okbg:#dcf5e5;--bad:#c2352a;--badbg:#fde8e5;--skin:#f2c7a5;--skin-line:#b9774f;--stage:#dfe9fb;--body:#b8c6e6;--disp:"Bricolage Grotesque",system-ui,sans-serif;--text:"Figtree",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1222;--surface:#151d33;--ink:#e9eefc;--muted:#9aa7c7;--line:#28324f;--accent:#7aa2ff;--accent-ink:#0c1222;--soft:#1d2a4d;--hot:#ff8a63;--ok:#5fd18a;--okbg:#12301f;--bad:#ff8f84;--badbg:#3a1c19;--skin:#e0ae8a;--skin-line:#8a5535;--stage:#1a2644;--body:#34456f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1222;--surface:#151d33;--ink:#e9eefc;--muted:#9aa7c7;--line:#28324f;--accent:#7aa2ff;--accent-ink:#0c1222;--soft:#1d2a4d;--hot:#ff8a63;--ok:#5fd18a;--okbg:#12301f;--bad:#ff8f84;--badbg:#3a1c19;--skin:#e0ae8a;--skin-line:#8a5535;--stage:#1a2644;--body:#34456f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--text);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 0;margin:0 auto;max-width:900px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;font:800 1.35rem var(--disp);padding:0}
.top nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.top nav button{border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:700;white-space:nowrap}
.top nav button.on{background:var(--soft);color:var(--accent)}
.stats{display:flex;gap:14px;font-size:.88rem;color:var(--muted)}.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
main{max-width:900px;margin:0 auto;padding-block:12px 40px;outline:none}
footer{max-width:900px;margin:0 auto;padding-bottom:28px;color:var(--muted);font-size:.82rem}
h1{font:800 clamp(1.7rem,5vw,2.4rem)/1.1 var(--disp);margin:0 0 8px;text-wrap:balance}
h2{font:800 1.2rem var(--disp);margin:28px 0 12px}
.lead{color:var(--muted);margin:0 0 18px;max-width:60ch}
.muted{color:var(--muted)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 20px;border-radius:12px}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:6px}
/* Portada */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:24px}
.hero>*{min-width:0}
.hero .stage{max-height:300px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.lcard:hover{border-color:var(--accent)}
.lcard .stage{aspect-ratio:16/9;height:auto}
.lcard h3{font:800 1.05rem var(--disp);margin:0}.lcard p{margin:0;color:var(--muted);font-size:.9rem}
.badge{display:inline-block;font-size:.74rem;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:700}
.badge.done{background:var(--okbg);color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
/* Escenario de signo */
.stage{background:var(--stage);border-radius:14px;display:flex;justify-content:center;align-items:center;overflow:hidden;width:100%}
.stage svg{display:block;width:100%;height:100%;max-height:340px}
.sk-body{fill:var(--body)}.sk-face{fill:var(--body)}.sk-line{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;opacity:.45}
.sk-eye{fill:var(--ink);opacity:.5}
.hand .skin{fill:var(--skin);stroke:var(--skin-line);stroke-width:1.6}
.hand .cstroke{fill:none;stroke-linecap:round}
.mv{fill:none;stroke:var(--hot);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.mvhead{fill:var(--hot)}
.hghost{opacity:.4}
/* Visor de lección */
.viewer{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.viewer>*{min-width:0}
.viewer .stage{height:min(360px,60vw)}
.vside{display:flex;flex-direction:column;gap:10px}
.vside .word{font:800 2rem var(--disp);margin:0}
.vside p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}
.closeup{background:var(--stage);border-radius:12px;height:130px;display:flex;justify-content:center}
.closeup svg{height:100%;width:auto;max-width:100%}
.nav2{display:flex;gap:8px;margin-top:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.thumb{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px;text-align:center;font-weight:700;font-size:.88rem}
.thumb .stage{aspect-ratio:1;height:auto;margin-bottom:4px}
.thumb.on{border-color:var(--accent)}
/* Tarjetas */
.flash{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;text-align:center;display:grid;gap:10px}
.flash .stage{height:min(320px,62vw)}
.flash .w{font:800 1.9rem var(--disp)}
.hint{color:var(--muted)}
/* Test */
.q{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px;font-size:1.1rem}
.q .stage{height:min(300px,58vw)}
.opts{display:grid;gap:10px;margin:14px 0}
.opts.vis{grid-template-columns:1fr 1fr}
.opt{text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opts.vis .opt{padding:6px}.opts.vis .stage{aspect-ratio:1;height:auto}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{min-height:1.6em;font-weight:700}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.result{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 16px}
.result .big{font:800 3.4rem var(--disp)}
input[type=search]{width:100%;padding:12px 14px;font:inherit;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:14px}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dentry{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.dentry .stage{aspect-ratio:1;height:auto}.dentry h3{margin:0;font:800 1.05rem var(--disp)}.dentry p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.media{width:100%;max-height:260px;border-radius:12px;background:#000}
@media (max-width:640px){.hero,.viewer{grid-template-columns:1fr}.top nav{order:3;flex-basis:100%}}
@media (prefers-reduced-motion:no-preference){.mv-anim{stroke-dasharray:6 5;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}}
/* v3 */
.eyebrow{font:700 .78rem var(--text);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.btn.sm{padding:8px 14px;font-size:.88rem}
.row.between{justify-content:space-between}
.iconbtn{border:0;background:var(--soft);color:var(--accent);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;padding:0}
.top nav{order:0}
.daily{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:8px}
.dcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
button.dcard:hover{border-color:var(--accent)}
.dcard>div{min-width:0}
.num{font:800 2rem/1 var(--disp);color:var(--accent);min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.ring .rg-bg{fill:none;stroke:var(--line);stroke-width:7}
.ring .rg-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.ring .rg-t{font:800 16px var(--disp);fill:var(--ink)}
.sm{font-size:.88rem}
.q span{font-size:1rem;color:var(--muted)}
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:var(--soft);padding:4px;display:grid;place-items:center;font-weight:800;font-family:var(--disp);overflow:hidden}
.tile.up{background:var(--surface);border-color:var(--accent)}.tile.found{border-color:var(--ok);background:var(--okbg)}
.tile .stage{height:100%;aspect-ratio:auto}.tile .q2{font-size:2rem;color:var(--accent)}
.tile span{font-size:clamp(.85rem,3.6vw,1.2rem);padding:2px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.week .col{display:grid;grid-template-rows:1fr auto auto;height:100%;text-align:center;font-size:.75rem;color:var(--muted);align-items:end;gap:2px}
.week .col i{display:block;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px;width:60%;justify-self:center}
.week .col b{color:var(--ink);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.bdg{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;opacity:.55}
.bdg.got{opacity:1;border-color:var(--ok)}.bdg b{font-family:var(--disp)}.bdg span{font-size:.85rem;color:var(--muted)}.bdg em{font-size:.78rem;font-style:normal;font-weight:700;color:var(--muted)}.bdg.got em{color:var(--ok)}
.list{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(60px,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left}
.lrow:hover{border-color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;white-space:nowrap;font-size:.85rem;font-weight:600}
.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:640px){.top{gap:8px 12px}.top nav{order:5;flex-basis:100%}.stats{margin-left:auto}}
</style>
<header class="top">
  <button class="brand" data-go="home" aria-label="Signa, inicio"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect width="24" height="24" rx="7" fill="var(--accent)"/><path d="M8 17V9m4 8V6m4 11V10" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/></svg>Signa</button>
  <nav aria-label="Principal">
    <button data-go="home" data-nav="home">Lecciones</button>
    <button data-go="practica" data-nav="practica">Practicar</button>
    <button data-go="progreso" data-nav="progreso">Progreso</button>
    <button data-go="diccionario" data-nav="diccionario">Diccionario</button>
  </nav>
  <button class="iconbtn" id="theme" title="Cambiar tema" aria-label="Cambiar tema"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  <div class="stats" aria-live="polite">
    <span title="Días seguidos">Racha <b id="streak">0</b></span>
    <span title="Puntos">Puntos <b id="xp">0</b></span>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer><p>Contenido en borrador de Lengua de Signos Española. Las ilustraciones son esquemáticas: contrástalas con el diccionario de la CNSE y con personas sordas signantes.</p></footer>
<script>
// Contenido (Lengua de Signos Española, LSE). BORRADOR: valídalo con una persona sorda signante
// o con el diccionario de la CNSE antes de publicarlo. `media` admite URL de vídeo (.mp4/.webm) o imagen.
// shape: open5 flat fist up point v three four y c o l b i rock | rot: giro de la mano en grados
// loc: sien frente ceja mejilla boca barbilla pecho hombro neutro | mv: none | arrow(p) | shake(a) | circle
(function () {
  var N = { t: "none" };
  function A() { return { t: "arrow", p: [].slice.call(arguments) }; }
  function K(a) { return { t: "shake", a: a || "x" }; }
  function S(id, word, how, shape, rot, loc, mv, two) { return { id: id, word: word, how: how, media: "", shape: shape, rot: rot, loc: loc, mv: mv || N, two: !!two }; }
  window.LESSONS = [
    { id: "saludos", title: "Saludos y cortesía", desc: "Las primeras palabras para empezar cualquier conversación.", signs: [
      S("hola", "Hola", "Mano abierta junto a la sien o la frente; se aleja hacia fuera con un pequeño gesto, como un saludo.", "flat", 20, "sien", A([0, 0], [30, -8])),
      S("adios", "Adiós", "Mano abierta con la palma hacia fuera, doblando y estirando los dedos varias veces.", "open5", 0, "neutro", K("x")),
      S("gracias", "Gracias", "Mano plana que toca la barbilla y avanza hacia delante y hacia abajo, hacia la otra persona.", "flat", -35, "barbilla", A([0, 0], [16, 26])),
      S("si", "Sí", "Puño cerrado que se inclina arriba y abajo desde la muñeca, como un asentimiento.", "fist", 0, "neutro", K("y")),
      S("no", "No", "Dedo índice extendido que se mueve de lado a lado.", "point", 0, "neutro", K("x")),
      S("bien", "Bien", "Puño con el pulgar hacia arriba.", "up", 0, "neutro"),
      S("mal", "Mal", "Puño con el pulgar hacia abajo.", "up", 180, "neutro"),
      S("porfavor", "Por favor", "Manos planas con las palmas hacia arriba, con un pequeño movimiento hacia la otra persona y expresión amable.", "flat", 0, "neutro", A([0, 0], [0, -26]), true)
    ]},
    { id: "presentarse", title: "Presentarse", desc: "Habla de ti y pide que te lo repitan.", signs: [
      S("yo", "Yo", "Dedo índice que se apunta al pecho.", "point", 0, "pecho", A([0, 0], [-6, 8])),
      S("tu", "Tú", "Dedo índice que apunta hacia la otra persona.", "point", 90, "neutro", A([0, 0], [26, 0])),
      S("sordo", "Sordo/a", "Dedo índice que toca el oído y después la boca.", "point", 0, "mejilla", A([0, 0], [-6, 18])),
      S("oyente", "Oyente", "Dedo índice que sale de la boca hacia delante, en movimiento circular pequeño.", "point", 0, "boca", A([0, 0], [20, 6])),
      S("entender", "Entender", "Dedo índice junto a la frente; la mano se abre ligeramente al «caer la ficha».", "point", 0, "frente", A([0, 0], [14, -10])),
      S("despacio", "Despacio", "Manos planas con las palmas hacia abajo que descienden lentamente.", "flat", 90, "pecho", A([0, 0], [0, 22]), true),
      S("ayuda", "Ayuda", "Una mano en puño con el pulgar arriba se apoya sobre la palma de la otra y ambas suben.", "up", 0, "pecho", A([0, 0], [0, -22]), true)
    ]},
    { id: "numeros", title: "Números del 1 al 5", desc: "Cuenta con una mano. La configuración de los dedos es lo importante.", signs: [
      S("n1", "Uno", "Solo el dedo índice extendido; los demás, cerrados.", "point", 0, "neutro"),
      S("n2", "Dos", "Índice y corazón extendidos y separados.", "v", 0, "neutro"),
      S("n3", "Tres", "Índice, corazón y anular extendidos; pulgar y meñique recogidos.", "three", 0, "neutro"),
      S("n4", "Cuatro", "Cuatro dedos extendidos (sin el pulgar), palma hacia fuera.", "four", 0, "neutro"),
      S("n5", "Cinco", "Mano abierta con los cinco dedos extendidos y separados.", "open5", 0, "neutro")
    ]},
    { id: "colores", title: "Colores básicos", desc: "Muchos colores se signan señalando algo de la cara o del entorno.", signs: [
      S("rojo", "Rojo", "Dedo índice que roza los labios y baja ligeramente.", "point", 0, "boca", A([0, 0], [0, 24])),
      S("blanco", "Blanco", "Mano con los dedos juntos que toca el pecho y se aleja hacia delante.", "flat", 0, "pecho", A([0, 0], [28, 0])),
      S("negro", "Negro", "Dedo índice que se desliza sobre la ceja.", "point", 90, "ceja", A([0, 0], [-26, 0])),
      S("azul", "Azul", "Mano abierta que se agita suavemente con la palma hacia fuera, a la altura del hombro.", "open5", 0, "hombro", K("x")),
      S("verde", "Verde", "Mano en forma de «V» que se agita lateralmente delante del cuerpo.", "v", 0, "neutro", K("x")),
      S("amarillo", "Amarillo", "Mano en «Y» (pulgar y meñique extendidos) que gira desde la muñeca.", "y", 0, "neutro", { t: "circle" })
    ]},
    { id: "familia", title: "Familia", desc: "Los signos de las personas más cercanas.", signs: [
      S("madre", "Madre", "Mano en forma de «C» que toca la mejilla y baja hacia la barbilla.", "c", 0, "mejilla", A([0, 0], [0, 26])),
      S("padre", "Padre", "Dedo índice que toca la mejilla y luego se acerca al mentón.", "point", 0, "mejilla", A([0, 0], [-10, 26])),
      S("hermano", "Hermano/a", "Dos dedos índice juntos que se tocan por los costados, indicando «parejas».", "point", 0, "neutro", N, true),
      S("bebe", "Bebé", "Los brazos se cruzan como si se acunara a un bebé y se balancean suavemente.", "flat", 90, "pecho", K("x"), true),
      S("abuelo", "Abuelo/a", "Mano en forma de «C» que toca la barbilla y baja con un movimiento de alargamiento (barba).", "c", 0, "barbilla", A([0, 0], [0, 28]))
    ]},
    { id: "emociones", title: "Emociones", desc: "Cuerpo y cara cuentan tanto como las manos.", signs: [
      S("feliz", "Feliz", "Mano plana que sube en círculos sobre el pecho, con sonrisa.", "flat", 0, "pecho", { t: "circle" }),
      S("triste", "Triste", "Mano abierta delante de la cara que baja despacio, con gesto de pena.", "open5", 0, "frente", A([0, 0], [0, 40])),
      S("enfadado", "Enfadado/a", "Mano en forma de garra delante de la cara, que se tensa, con gesto serio.", "c", 0, "frente", K("y")),
      S("cansado", "Cansado/a", "Manos planas sobre el pecho que caen hacia abajo, con los hombros hundidos.", "flat", 0, "pecho", A([0, 0], [0, 20]), true),
      S("querer", "Querer", "Mano en garra que se cierra y se acerca al pecho.", "c", 0, "neutro", A([0, 0], [-24, 8]))
    ]},
    { id: "preguntas", title: "Preguntas", desc: "En signos, las cejas hacen la mitad de la pregunta.", signs: [
      S("que", "¿Qué?", "Dedo índice que se agita de lado a lado, con cejas fruncidas y la cabeza ligeramente inclinada.", "point", 0, "neutro", K("x")),
      S("quien", "¿Quién?", "Dedo índice que gira delante de la boca, con cejas fruncidas.", "point", 0, "boca", { t: "circle" }),
      S("donde", "¿Dónde?", "Mano abierta con palma hacia arriba que se mueve en pequeños círculos.", "open5", 0, "neutro", K("x")),
      S("cuando", "¿Cuándo?", "Dedo índice que gira sobre el otro índice, como una aguja de reloj.", "point", 0, "neutro", { t: "circle" }, true),
      S("porque", "¿Por qué?", "Dedo índice que toca la frente y avanza hacia delante, con cejas fruncidas.", "point", 0, "frente", A([0, 0], [28, -6]))

    function draw() {
      if (!deck.length) return render('<div class="result"><div class="big">Todo al día</div><p class="lead" style="margin:8px auto 18px">No hay signos pendientes. Vuelve mañana o haz un test.</p><button class="btn" data-go="' + bk + '" data-arg="' + (bkArg || "") + '">Volver</button></div>', "practica");
      if (i >= deck.length) { addXp(5 + deck.length); return render('<div class="result"><div class="big">¡Listo!</div><p class="lead" style="margin:8px auto 18px">Has repasado ' + deck.length + " signos. +" + (5 + deck.length) + ' puntos</p><button class="btn" data-go="' + bk + '" data-arg="' + (bkArg || "") + '">Volver</button></div>', "practica"); }
      var s = deck[i];
      var h = back(bk, bkArg) + "<h1>" + esc(title) + '</h1><p class="muted">Tarjeta ' + (i + 1) + " de " + deck.length + '</p><div class="bar" style="margin-bottom:12px"><i style="width:' + (100 * i / deck.length) + '%"></i></div>';
      h += '<div class="flash">' + stage(s, { anim: 1 }) + (shown ? '<div class="w">' + esc(s.word) + "</div>" + chips(s) + "<div>" + esc(s.how) + "</div>" + mediaHtml(s) : '<div class="hint">¿Qué signo es? Piénsalo y pulsa para ver la respuesta.</div>') + "</div>";
      h += '<div class="row" style="margin-top:14px">' + (shown ? '<button class="btn ghost" id="no">Otra vez (1)</button><button class="btn" id="yes">Lo sabía (2)</button>' : '<button class="btn" id="show">Mostrar respuesta (Espacio)</button>') + speedBtn() + "</div>";
      render(h, "practica"); bindSpeed();
      if (shown) {
        var rate = function (ok) { grade(s.id, ok); save(); i++; shown = false; draw(); };
        document.getElementById("yes").onclick = function () { rate(true); }; document.getElementById("no").onclick = function () { rate(false); };
        keyFn = function (e) { if (e.key === "1") rate(false); if (e.key === "2" || e.key === "Enter") rate(true); };
      } else {
        var sh = function () { shown = true; draw(); };
        document.getElementById("show").onclick = sh;
        keyFn = function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); sh(); } };
      }
    }
    draw();
  }

  function quiz(pool, lessonId, bk, bkArg, title) {
    var qs = shuffle(pool).slice(0, 8), i = 0, ok = 0;
    function distract(s) {
      var same = shuffle(ALL.filter(function (x) { return x.id !== s.id && x.lesson === s.lesson; })).slice(0, 2);
      var rest = shuffle(ALL.filter(function (x) { return x.id !== s.id && same.indexOf(x) < 0; }));
      return same.concat(rest).slice(0, 3);
    }
    function draw() {
      if (i >= qs.length) return end();
      var s = qs[i], kind = ["see", "pick", "read"][Math.floor(Math.random() * 3)], opts = shuffle([s].concat(distract(s)));
      var h = back(bk, bkArg) + '<p class="muted">' + esc(title) + " · Pregunta " + (i + 1) + " de " + qs.length + "</p>";
      h += '<div class="q">' + (kind === "see" ? stage(s, { anim: 1 }) + "<b>¿Qué significa este signo?</b>" : kind === "pick" ? "<b>¿Cuál es el signo de «" + esc(s.word) + "»?</b>" : "<b>¿Qué signo se describe así?</b><span>" + esc(s.how) + "</span>") + "</div>";
      h += '<div class="opts' + (kind === "pick" ? " vis" : "") + '">' + opts.map(function (o) { return '<button class="opt" data-id="' + o.id + '">' + (kind === "pick" ? stage(o, { anim: 1 }) : esc(o.word)) + "</button>"; }).join("") + '</div><div class="fb" id="fb" role="status"></div><div id="nx"></div>';
      render(h, "practica"); keyFn = null;
      [].forEach.call(document.querySelectorAll(".opt"), function (b) {
        b.onclick = function () {
          var right = b.dataset.id === s.id;
          [].forEach.call(document.querySelectorAll(".opt"), function (x) { x.disabled = true; if (x.dataset.id === s.id) x.classList.add("ok"); });
          if (!right) b.classList.add("bad"); else ok++;
          grade(s.id, right); save();
          var fb = document.getElementById("fb"); fb.className = "fb " + (right ? "ok" : "bad"); fb.textContent = right ? "¡Correcto!" : "Era: " + s.word + ". " + s.how;
          document.getElementById("nx").innerHTML = '<button class="btn" id="go">' + (i + 1 < qs.length ? "Siguiente" : "Ver resultado") + "</button>";
          var go2 = document.getElementById("go"); go2.focus(); go2.onclick = function () { i++; draw(); };
        };
      });
    }
    function end() {
      var p = ok / qs.length, passed = p >= PASS, gain = ok * 10, first = false;
      if (lessonId) { state.best[lessonId] = Math.max(state.best[lessonId] || 0, Math.round(p * 100)); if (passed) { if (!state.done[lessonId]) { gain += 30; first = true; } state.done[lessonId] = true; } }
      addXp(gain);
      render('<div class="result"><div class="big">' + ok + " / " + qs.length + '</div><p class="lead" style="margin:8px auto 18px">' + (passed ? (first ? "¡Lección completada! " : "¡Muy bien! ") : "Casi. Necesitas un " + PASS * 100 + "% para completar la lección. ") + "+" + gain + ' puntos</p><div class="row" style="justify-content:center"><button class="btn" data-go="' + bk + '" data-arg="' + (bkArg || "") + '">Continuar</button><button class="btn ghost" id="again">Repetir</button></div></div>', "practica");
      document.getElementById("again").onclick = function () { quiz(pool, lessonId, bk, bkArg, title); };
    }
    draw();
  }

  function parejas(pool, bk, bkArg, title) {
    var set = shuffle(pool).slice(0, 6), tiles = [];
    set.forEach(function (s) { tiles.push({ s: s, k: "w" }); tiles.push({ s: s, k: "i" }); });
    tiles = shuffle(tiles);
    var open = [], found = {}, moves = 0, lock = false;
    function draw() {
      var h = back(bk, bkArg) + "<h1>Parejas</h1><p class=\"lead\">Une cada ilustración con su palabra. Movimientos: <b>" + moves + "</b></p><div class=\"memo\">";
      tiles.forEach(function (t, n) {
        var vis = found[t.s.id] || open.indexOf(n) >= 0;
        h += '<button class="tile' + (vis ? " up" : "") + (found[t.s.id] ? " found" : "") + '" data-n="' + n + '" aria-label="' + (vis ? (t.k === "w" ? t.s.word : "Ilustración") : "Carta oculta") + '">' + (vis ? (t.k === "w" ? "<span>" + esc(t.s.word) + "</span>" : stage(t.s)) : '<span class="q2">?</span>') + "</button>";
      });
      render(h + "</div>", "practica"); keyFn = null;
      [].forEach.call(document.querySelectorAll(".tile"), function (b) { b.onclick = function () { flip(+b.dataset.n); }; });
      if (Object.keys(found).length === set.length) {
        var gain = Math.max(10, 30 - moves); addXp(gain); state.games++; save();
        app.insertAdjacentHTML("beforeend", '<div class="result" style="margin-top:16px"><div class="big">¡Todas!</div><p class="lead" style="margin:8px auto 18px">' + moves + " movimientos. +" + gain + ' puntos</p><div class="row" style="justify-content:center"><button class="btn" data-go="' + bk + '" data-arg="' + (bkArg || "") + '">Continuar</button><button class="btn ghost" id="again">Jugar otra vez</button></div></div>');
        document.getElementById("again").onclick = function () { parejas(pool, bk, bkArg, title); };
      }
    }
    function flip(n) {
      if (lock || open.indexOf(n) >= 0 || found[tiles[n].s.id]) return;
      open.push(n); draw();
      if (open.length === 2) {
        moves++; var a = tiles[open[0]], b = tiles[open[1]];
        if (a.s.id === b.s.id && a.k !== b.k) { found[a.s.id] = 1; open = []; grade(a.s.id, true); save(); setTimeout(draw, 300); }
        else { lock = true; setTimeout(function () { open = []; lock = false; draw(); }, 900); }
      }
    }
    draw();
  }

  function practica() {
    var due = pending().length;
    render('<h1>Practicar</h1><p class="lead">Hoy toca repasar ' + due + " signos. El repaso espaciado te los vuelve a mostrar justo antes de que se olviden.</p>" +
      '<div class="grid"><button class="lcard" data-go="cards" data-arg="repaso"><h3>Tarjetas de repaso</h3><p>12 signos pendientes. Lo que fallas vuelve antes.</p></button><button class="lcard" data-go="test" data-arg="todo"><h3>Test mixto</h3><p>8 preguntas de todas las lecciones: ver, describir y elegir la ilustración.</p></button><button class="lcard" data-go="parejas" data-arg="todo"><h3>Parejas</h3><p>Juego de memoria: une ilustración y palabra.</p></button></div>', "practica");
  }

  var BADGES = [
    ["Primer paso", "Completa una lección", function () { return Object.keys(state.done).length >= 1; }],
    ["Constante", "Racha de 3 días", function () { return state.streak >= 3; }],
    ["Centenar", "Consigue 100 puntos", function () { return state.xp >= 100; }],
    ["Perfecto", "Un test con 100 %", function () { return Object.keys(state.best).some(function (k) { return state.best[k] === 100; }); }],
    ["Medio camino", "Completa 5 lecciones", function () { return Object.keys(state.done).length >= 5; }],
    ["Memoria", "Gana una partida de parejas", function () { return state.games >= 1; }],
    ["Conocedor", "Domina 20 signos", function () { return ALL.filter(mastered).length >= 20; }],
    ["Todo el curso", "Completa las 10 lecciones", function () { return Object.keys(state.done).length >= LESSONS.length; }]
  ];
  function progreso() {
    var m = ALL.filter(mastered).length, h = "<h1>Tu progreso</h1>";
    h += '<section class="daily"><div class="dcard">' + goalRing(today(), 64) + '<div><b>Meta de hoy</b><br><span class="muted">' + GOAL + ' puntos al día</span></div></div><div class="dcard"><span class="num">' + level() + '</span><div><b>Nivel</b><br><span class="muted">' + state.xp + " puntos en total</span></div></div><div class=\"dcard\"><span class=\"num\">" + m + '</span><div><b>Signos dominados</b><br><span class="muted">de ' + ALL.length + "</span></div></div></section>";
    var bars = "", mx = GOAL;
    for (var d = 6; d >= 0; d--) { var v = state.hist[day(d)] || 0; mx = Math.max(mx, v); }
    for (d = 6; d >= 0; d--) { v = state.hist[day(d)] || 0; var dn = new Date(Date.now() - d * MS).toLocaleDateString("es", { weekday: "short" }); bars += '<div class="col"><i style="height:' + Math.round(100 * v / mx) + '%"></i><span>' + dn + '</span><b>' + v + "</b></div>"; }
    h += '<h2>Últimos 7 días</h2><div class="week" role="img" aria-label="Puntos de los últimos 7 días">' + bars + "</div>";
    h += "<h2>Logros</h2><div class=\"badges\">" + BADGES.map(function (b) { var ok = b[2](); return '<div class="bdg' + (ok ? " got" : "") + '"><b>' + b[0] + "</b><span>" + b[1] + "</span><em>" + (ok ? "Conseguido" : "Pendiente") + "</em></div>"; }).join("") + "</div>";
    h += "<h2>Por lección</h2><div class=\"list\">" + LESSONS.map(function (l) { return '<button class="lrow" data-go="lesson" data-arg="' + l.id + '"><span>' + esc(l.title) + '</span><span class="bar"><i style="width:' + pct(l) + '%"></i></span><span class="muted">' + (state.best[l.id] !== undefined ? "mejor " + state.best[l.id] + " %" : pct(l) + " %") + "</span></button>"; }).join("") + "</div>";
    h += '<h2>Ajustes</h2><div class="row">' + speedBtn() + '<button class="btn ghost sm" id="reset">Borrar progreso</button></div><div id="rs"></div>';
    render(h, "progreso"); bindSpeed();
    document.getElementById("reset").onclick = function () {
      document.getElementById("rs").innerHTML = '<p class="fb bad">Se borrarán puntos, rachas y logros. ¿Seguro?</p><div class="row"><button class="btn sm" id="yes">Sí, borrar</button><button class="btn ghost sm" id="no">Cancelar</button></div>';
      document.getElementById("no").onclick = function () { document.getElementById("rs").innerHTML = ""; };
      document.getElementById("yes").onclick = function () { var t = state.theme; state = { xp: 0, streak: 0, last: "", done: {}, best: {}, box: {}, due: {}, hist: {}, theme: t, slow: false, games: 0 }; save(); progreso(); };
    };
  }

  function diccionario(filter, q) {
    filter = filter || "todas"; q = q || "";
    function list() {
      var t = q.trim().toLowerCase();
      var r = ALL.filter(function (s) { return (filter === "todas" || s.lesson === filter) && (!t || (s.word + " " + s.how).toLowerCase().indexOf(t) >= 0); });
      return r.map(function (s) { return '<div class="dentry">' + stage(s) + "<div><h3>" + esc(s.word) + "</h3>" + chips(s) + "<p>" + esc(s.how) + "</p></div></div>"; }).join("") || '<p class="muted">No hay signos que coincidan.</p>';
    }
    var h = '<h1>Diccionario</h1><input type="search" id="q" value="' + esc(q) + '" placeholder="Buscar por palabra o descripción" aria-label="Buscar un signo"><div class="filters">' +
      [["todas", "Todas"]].concat(LESSONS.map(function (l) { return [l.id, l.title]; })).map(function (f) { return '<button class="fchip' + (f[0] === filter ? " on" : "") + '" data-f="' + f[0] + '">' + esc(f[1]) + "</button>"; }).join("") + '</div><div class="dict" id="res">' + list() + "</div>";
    render(h, "diccionario");
    document.getElementById("q").oninput = function (e) { q = e.target.value; document.getElementById("res").innerHTML = list(); };
    [].forEach.call(document.querySelectorAll(".fchip"), function (b) { b.onclick = function () { diccionario(b.dataset.f, document.getElementById("q").value); }; });
  }

  function route() {
    var a = cur.a, l; keyFn = null;
    switch (cur.v) {
      case "lesson": return lesson(a);
      case "cards": if (a === "repaso") return cards(pending(), "practica", "", "Repaso"); l = lessonById(a); return l ? cards(l.signs, "lesson", l.id, l.title) : home();
      case "test": if (a === "todo") return quiz(ALL, null, "practica", "", "Test mixto"); l = lessonById(a); return l ? quiz(l.signs, l.id, "lesson", l.id, l.title) : home();
      case "parejas": if (a === "todo") return parejas(ALL, "practica", "", "Parejas"); l = lessonById(a); return l ? parejas(l.signs, "lesson", l.id, l.title) : home();
      case "practica": return practica();
      case "progreso": return progreso();
      case "diccionario": return diccionario();
      default: return home();
    }
  }
  applyTheme(); header(); route();
})();
</script>
