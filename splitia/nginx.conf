server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # El service worker y el manifest nunca se cachean: así las actualizaciones llegan siempre.
  location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /registerSW.js    { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
  location = /index.html       { add_header Cache-Control "no-cache"; }

  # Ficheros con hash en el nombre: caché eterna.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # SPA: cualquier ruta devuelve index.html.
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
